<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="weather-container">
        <h1>Weather App</h1>
        
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name...">
            <button onclick="getWeather()">Search</button>
            <button onclick="getLocationWeather()" id="locationBtn">📍 My Location</button>
        </div>

        <!-- Radar Animation Loader -->
        <div id="loader" class="radar-loader hidden">
            <div class="sweep"></div>
        </div>

        <!-- Weather Data Display -->
        <div id="weatherData" class="hidden">
            <h2 id="cityName">--</h2>
            
            <!-- Dynamic Weather Icon -->
            <img id="weatherIcon" src="" alt="Weather Icon" class="weather-icon">
            
            <h1 id="temp">-- °C</h1>
            <p id="description">--</p>
            
            <!-- Extra Weather Details -->
            <div class="weather-details">
                <div class="detail-box">
                    <p>💧 Humidity</p>
                    <h3 id="humidity">-- %</h3>
                </div>
                <div class="detail-box">
                    <p>💨 Wind Speed</p>
                    <h3 id="wind">-- km/h</h3>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js?v=2"></script>
</body>
</html>
